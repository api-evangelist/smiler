name: Smiler
description: >-
  Smiler is an Amsterdam-based on-the-spot photography marketplace that connects
  travelers and consumers with a network of professional freelance photographers
  at popular tourist hotspots and leisure locations worldwide. Founded in 2020,
  Smiler lets people book fast, affordable photoshoots in advance across 100+
  destinations, with photos delivered within 48 hours and free cancellation up
  to 24 hours before the shoot. The company also operates the Smiler Photographer
  Suite, an all-in-one tool for photographers to build portfolio websites, manage
  bookings, deliver mobile-friendly client galleries, and handle payments. Smiler
  is trusted by tens of thousands of photographers across 50+ countries and is
  backed by Speedinvest, Mosaic Ventures, Dutch Founders Fund, and PROfounders.
